<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Power preset and GPU policy</title><desc id="desc">Battery controls apply CPU and display settings immediately. The saved GPU preference applies at the next login. Automatic selects RX on barrel power and iGPU on USB-C or battery.</desc><rect width="1200" height="340" rx="20" fill="#161b21"/><g font-family="sans-serif" fill="#f3f5f7"><text x="52" y="68" font-size="30">One menu, two application times</text><path d="M340 150H430M340 150V258H430" stroke="#8f9fb3" stroke-width="3" fill="none"/><rect x="50" y="106" width="290" height="88" rx="12" fill="#303d51"/><text x="76" y="158" font-size="25">Battery → power preset</text><rect x="430" y="106" width="718" height="88" rx="12" fill="#253447"/><text x="455" y="142" font-size="25" fill="#a8c7ff">Applies now</text><text x="455" y="176" font-size="22">CPU target, boost policy and display refresh</text><rect x="430" y="214" width="718" height="88" rx="12" fill="#253b33"/><text x="455" y="250" font-size="25" fill="#b6e2cc">Applies at the next login</text><text x="455" y="284" font-size="22">Desktop GPU: RX on barrel, iGPU on USB-C or battery</text></g></svg>